<!DOCTYPE html>
<html>
<head>
<title>Should I Buy It?</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Times New Roman", serif;
}

body {
  margin: 0;
  background: #111;
  color: white;
  padding: 30px 15px;
}

.box {
  max-width: 420px;
  margin: auto;
  background: #1c1c1c;
  border: 2px solid #e00000;
  border-radius: 10px;
  padding: 20px;
}

h1 {
  color: #e00000;
  text-align: center;
}

p {
  text-align: center;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  background: #2b2b2b;
  color: white;
  border: 1px solid #555;
  border-radius: 5px;
  font-size: 16px;
}

#currency {
  width: 90px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 25px;
  background: #e00000;
  color: white;
  border: 0;
  border-radius: 5px;
  font-size: 18px;
  font-weight: bold;
}

#result {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #2b2b2b;
  border: 1px solid #e00000;
  border-radius: 5px;
  text-align: center;
  line-height: 1.5;
}

.title {
  color: #e00000;
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="box">

<h1>Should I Buy It?</h1>

<p>
This calculator uses the 50/30/20 budgeting rule to help you decide if a purchase fits your budget.
</p>

<label>Currency</label>
<select id="currency">
  <option value="€">€ EUR</option>
  <option value="$">$ USD</option>
</select>

<label>Monthly Income</label>
<input id="income" type="number" placeholder="e.g. 2000">

<label>Monthly Spending</label>
<input id="spending" type="number" placeholder="e.g. 1000">

<label>Short-Term Savings</label>
<input id="savings" type="number" placeholder="e.g. 1500">

<label>Item Cost</label>
<input id="cost" type="number" placeholder="e.g. 100">

<button onclick="calculate()">Should I Buy It?</button>

<div id="result"></div>

</div>

<script>

function calculate() {

  let currency = document.getElementById("currency").value;
  let income = Number(document.getElementById("income").value);
  let spending = Number(document.getElementById("spending").value);
  let savings = Number(document.getElementById("savings").value);
  let cost = Number(document.getElementById("cost").value);
  let result = document.getElementById("result");

  if (income <= 0 || spending < 0 || savings < 0 || cost <= 0) {
    result.innerHTML = "Please enter valid amounts.";
    result.style.display = "block";
    return;
  }

  /* 50/30/20 rule */

  let needs = income * 0.50;
  let wants = income * 0.30;
  let saving = income * 0.20;

  let savingsPercent = savings > 0 ? (cost / savings) * 100 : 100;

  let answer;

  if (spending <= needs && cost <= wants * 0.25 && savingsPercent <= 10) {

    answer = "Yes, you should buy it!<br>" +
             "This purchase fits comfortably within your budget.";

  } else if (spending <= needs && cost <= wants * 0.50 && savingsPercent <= 20) {

    answer = "Probably okay!<br>" +
             "The purchase is a reasonable size for your budget.";

  } else if (spending <= needs && cost <= wants && savingsPercent <= 30) {

    answer = "Think about it.<br>" +
             "You may be able to afford it, but it will affect your money.";

  } else if (spending <= needs && cost <= wants * 1.5 && savingsPercent <= 50) {

    answer = "Be careful!<br>" +
             "It may be better to save more before buying this.";

  } else {

    answer = "No, don't buy it!<br>" +
             "This purchase does not fit well with the 50/30/20 guideline.";

  }

  result.innerHTML =
    "<div class='title'>" + answer + "</div>" +
    "<br>" +
    "50% needs budget: " + currency + needs.toFixed(2) +
    "<br>30% wants budget: " + currency + wants.toFixed(2) +
    "<br>20% savings target: " + currency + saving.toFixed(2) +
    "<br><br>Monthly spending: " + currency + spending.toFixed(2) +
    "<br>Item cost: " + currency + cost.toFixed(2);

  result.style.display = "block";
}

</script>

</body>
</html>
